[package]
name = "aegis-oppai"
version = "0.1.3"
description = "Linux launcher for the Xenoblade Chronicles 2 NS2 static recompilation: build from your own dump, configure and play through Wine or Proton"
edition = "2021"
license = "GPL-3.0-or-later"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
base64 = "0.22"
ureq = { version = "2", default-features = false, features = ["tls"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
