# The universal AppImage, built on Ubuntu 22.04 (its WebKitGTK and glibc make it run on Ubuntu/Kubuntu 22.04 and newer, Arch,
# CachyOS, Fedora...). Every push builds it as an artifact; a tag v* also publishes it as that release's asset.
name: appimage
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      # the launcher looks for its own updates in this repository
      XC2L_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libfuse2 python3-pil file cmake libudev-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo install tauri-cli --version "^2" --locked
      # SDL3 for Proton's controller bus, carried inside the launcher (systems without libSDL3)
      - run: scripts/build-sdl3.sh
      - run: cd src-tauri && cargo test
      - run: scripts/appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: AppImage
          path: build/*.AppImage
      - name: Release asset
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "The Aegis’s Oppai $GITHUB_REF_NAME" --notes-file RELEASE-NOTES.md
          gh release upload "$GITHUB_REF_NAME" build/*.AppImage --clobber
